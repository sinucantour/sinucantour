<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SinucanTOUR - Montería</title>
  <link rel="stylesheet" href="sinucan.css">
</head>
<body>

  <!-- ... TU ENCABEZADO Y CONTENIDO ANTERIOR AQUÍ (SIN CAMBIOS) ... -->

  <section id="contacto" class="tab-content">
    <div class="section">
      <h2>Contáctanos</h2>
      <p>Estamos aquí para ayudarte a que tu perro viva su mejor vida. Contáctanos para reservar un paseo, resolver dudas o unirte a nuestra comunidad canina en Montería.</p>
    </div>

    <div class="section">
      <!-- ✅ FORMULARIO FUNCIONAL -->
      <form action="https://formsubmit.co/javierdress02@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://sinucantour.github.io/sinucantour/gracias.html">

        <input type="text" name="nombre" placeholder="Nombre completo" required class="form-field">
        <input type="email" name="correo" placeholder="Correo electrónico" required class="form-field">
        <input type="tel" name="telefono" placeholder="Teléfono" required class="form-field">

        <select name="plan" required class="form-field">
            <option value="" disabled selected>Selecciona un plan</option>
            <option value="Básico">Básico</option>
            <option value="Premium">Premium</option>
            <option value="Plus">Plus</option>
        </select>

        <textarea name="mensaje" placeholder="Cuéntanos sobre tu perro..." required class="form-field"></textarea>

        <button type="submit" class="btn-paw">Enviar Mensaje</button>
      </form>
    </div>

    <div class="section social-links">
      <p>Síguenos para ver fotos y eventos:</p>
      <a href="https://www.instagram.com/sinucan_?igsh=d21yZXg4ZmNwN2Nh" class="social-btn" target="_blank">Instagram</a>
      <!-- ✅ BOTÓN WHATSAPP FUNCIONAL -->
      <a href="https://wa.me/573235882174?text=Hola%2C%20quiero%20más%20información%20sobre%20los%20paseos%20caninos" class="social-btn" target="_blank">WhatsApp</a>
    </div>
  </section>

  <!-- FOOTER Y JS -->
  <script src="sinucan.js"></script>
</body>
</html>
